<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yaboo Shop Board</title>
<meta name="description" content="Live production board for Yaboo Fence Co.'s PVC, welding, wood, yard and mechanic shops.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar (wordmark · board notice · clock · Edit / TV), a tab rail of the five shops,
   then either the all-shops overview (five columns on a TV, stacked on a phone) or one shop's crew cards.
   Changes are made in a bottom sheet. Dark-first, because the office TV is the main screen. */
:root{
  --bg:#14171c; --panel:#1b1f26; --panel-2:#242932; --line:#2f3641; --line-2:#3e4756;
  --fg:#ece9e2; --muted:#a0a7b1; --faint:#6f7784;
  --accent:#ff8a1f; --accent-fg:#1a1004;
  --ok:#4cc063; --warn:#ecb83f; --bad:#f4625a;
  --ok-soft:rgba(76,192,99,.18); --warn-soft:rgba(236,184,63,.2); --bad-soft:rgba(244,98,90,.2);
  --shop-pvc:#d9dfe6; --shop-weld:#ff8a1f; --shop-wood:#cf9052; --shop-yard:#6fc47a; --shop-mech:#63a8ec; --shop-field:#b9a2f5; --accent-soft:rgba(255,138,31,.1);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:Barlow,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 14px 44px rgba(0,0,0,.5);
  --backdrop:rgba(5,7,10,.62);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f0eb; --panel:#ffffff; --panel-2:#f5f3ee; --line:#dcd8cf; --line-2:#c6c1b6;
    --fg:#1b1e24; --muted:#5b616a; --faint:#8b919a;
    --accent:#e06f0a; --accent-fg:#ffffff;
    --ok:#1e8f3a; --warn:#b0761a; --bad:#c9352d;
    --ok-soft:rgba(30,143,58,.14); --warn-soft:rgba(176,118,26,.16); --bad-soft:rgba(201,53,45,.14);
    --shop-pvc:#8a939c; --shop-weld:#e06f0a; --shop-wood:#a86d32; --shop-yard:#2e9a45; --shop-mech:#2e7fd2; --shop-field:#7353c9; --accent-soft:rgba(224,111,10,.09);
    --shadow:0 14px 44px rgba(20,22,30,.2);
    --backdrop:rgba(30,32,40,.45);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f2f0eb; --panel:#ffffff; --panel-2:#f5f3ee; --line:#dcd8cf; --line-2:#c6c1b6;
  --fg:#1b1e24; --muted:#5b616a; --faint:#8b919a;
  --accent:#e06f0a; --accent-fg:#ffffff;
  --ok:#1e8f3a; --warn:#b0761a; --bad:#c9352d;
  --ok-soft:rgba(30,143,58,.14); --warn-soft:rgba(176,118,26,.16); --bad-soft:rgba(201,53,45,.14);
  --shop-pvc:#8a939c; --shop-weld:#e06f0a; --shop-wood:#a86d32; --shop-yard:#2e9a45; --shop-mech:#2e7fd2; --shop-field:#7353c9; --accent-soft:rgba(224,111,10,.09);
  --shadow:0 14px 44px rgba(20,22,30,.2);
  --backdrop:rgba(30,32,40,.45);
  color-scheme:light;
}

html{font-size:clamp(14px, 0.5vw + 11px, 21px)}
body{background:var(--bg); color:var(--fg); font-family:var(--body); line-height:1.35; font-size:1rem}
*{box-sizing:border-box}
.app{min-height:100%; display:flex; flex-direction:column; padding-inline:16px; padding-block:0 2rem; gap:0}
h1,h2,h3,h4{text-wrap:balance}

/* top bar */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); display:flex; align-items:center; gap:.6rem 1rem; padding-block:.7rem; border-bottom:1px solid var(--line); flex-wrap:wrap}
.brand{font-family:var(--display); font-weight:700; font-size:1.7rem; letter-spacing:.05em; text-transform:uppercase; line-height:1; white-space:nowrap}
.brand b{color:var(--accent); font-weight:700}
.notice{flex:1 1 100%; order:3; min-width:0; color:var(--warn); font-weight:600; display:flex; align-items:center; gap:.5rem}
.notice .lbl{font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); flex:none}
.notice .txt{overflow-wrap:anywhere}
.clock{margin-left:auto; text-align:right; font-variant-numeric:tabular-nums; line-height:1.15; white-space:nowrap}
.clock .d{font-size:.75rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted)}
.clock .t{font-family:var(--display); font-size:1.5rem; font-weight:600}
.ctrl{display:flex; gap:.5rem; align-items:center}
@media (min-width:900px){ .notice{flex:1 1 auto; order:0} .clock{margin-left:0} }
@media (max-width:520px){ .brand{font-size:1.35rem} .clock .t{font-size:1.25rem} .ctrl{flex-wrap:wrap} }

/* tabs */
.tabs{display:flex; gap:.3rem; overflow-x:auto; padding-block:.7rem; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:1.1rem; padding:.4em .85em; border:1px solid transparent; border-radius:5px; background:none; color:var(--muted); cursor:pointer; white-space:nowrap; display:flex; gap:.5em; align-items:center; line-height:1}
.tab .sw{width:.6em; height:.6em; border-radius:2px; background:var(--shop,var(--muted)); flex:none}
.tab .n{font-family:var(--body); font-weight:600; font-size:.72em; color:var(--muted); background:var(--panel-2); padding:.15em .5em; border-radius:99px; font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{color:var(--fg); background:var(--panel); border-color:var(--line-2)}
.tab[aria-selected="true"] .n{background:var(--line-2)}

main{flex:1; min-width:0}

/* buttons */
.btn{font:inherit; font-weight:600; padding:.5em .9em; border-radius:6px; border:1px solid var(--line-2); background:var(--panel-2); color:var(--fg); cursor:pointer; white-space:nowrap; line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent); color:var(--accent-fg); border-color:transparent}
.btn.danger{color:var(--bad); border-color:var(--bad); background:transparent}
.btn.sm{padding:.32em .65em; font-size:.85em}
.btn.on{background:var(--accent); color:var(--accent-fg); border-color:transparent}
.btn:disabled{opacity:.5; cursor:default}
.btn:focus-visible,.tab:focus-visible,.ovh:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
body:not(.editing) .ed{display:none !important}
body:not(.editing):not(.crew) .cr{display:none !important}
body:not(.editing):not(.crew) .jacts, body.tv .jacts{display:none !important}
body.tv .ed, body.tv .cr, body.tv .ctrl-edit, body.tv .ctrl-user{display:none !important}
/* progress */
.pw{grid-column:1/-1; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.15rem .6rem; align-items:center; padding-top:.15rem}
.pb{height:.5rem; background:var(--line); border-radius:3px; overflow:hidden; grid-column:1/-1}
.pb i{display:block; height:100%; width:0; background:var(--accent); border-radius:3px; transition:width .3s}
.pb.full i{background:var(--ok)}
.pl{font-size:.85em; color:var(--muted); font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.pl b{color:var(--fg); font-weight:600}
.pp{font-family:var(--display); font-weight:700; font-size:1.05rem; font-variant-numeric:tabular-nums; line-height:1}
.pp.full{color:var(--ok)}
.ovj .pw{padding-top:.2rem} .ovj .pb{height:.4rem} .ovj .pl{font-size:.8em}
.log{display:flex; flex-direction:column; gap:.3rem; border-top:1px solid var(--line); padding-top:.6rem}
.log .row{display:grid; grid-template-columns:auto minmax(0,1fr); gap:.2rem .6rem; font-size:.9em; align-items:baseline}
.log .amt{font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap}
.log .who{color:var(--muted)} .log .nt{grid-column:2; color:var(--faint); font-size:.9em; overflow-wrap:anywhere}
.acts{display:flex; gap:.5rem; flex-wrap:wrap; align-items:center}
.spacer{flex:1}

/* shared bits */
.sw{display:inline-block; width:.75rem; height:.75rem; border-radius:2px; background:var(--shop,var(--muted)); flex:none}
.sw.big{width:1.1rem; height:1.1rem; border-radius:3px}
.quiet{color:var(--faint); font-size:.92em}
.note{color:var(--muted); font-size:.9em; margin:0; border-left:2px solid var(--line-2); padding-left:.6em}
.chip{display:inline-flex; align-items:center; gap:.4em; font-size:.85em; font-weight:500; padding:.2em .6em; border-radius:99px; background:var(--panel-2); border:1px solid var(--line); white-space:nowrap; max-width:100%}
.chip .dot{width:.55em; height:.55em; border-radius:50%; background:var(--ok); flex:none}
.chip.service{background:var(--warn-soft); border-color:transparent; color:var(--warn)} .chip.service .dot{background:var(--warn)}
.chip.down{background:var(--bad-soft); border-color:transparent; color:var(--bad)} .chip.down .dot{background:var(--bad)}
.chip .chipst{font-weight:600; text-transform:uppercase; font-size:.78em; letter-spacing:.06em}
body.editing .chip.ed-click{cursor:pointer}
.due{font-size:.78em; font-weight:600; padding:.15em .55em; border-radius:99px; background:var(--line); color:var(--fg); white-space:nowrap; font-variant-numeric:tabular-nums; justify-self:end}
.due.warn{background:var(--warn-soft); color:var(--warn)}
.due.bad{background:var(--bad-soft); color:var(--bad)}
.due.ok{background:var(--ok-soft); color:var(--ok)}
.eqrow{display:flex; gap:.45rem; flex-wrap:wrap; align-items:center}
.eqlbl{font-size:.7rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin-right:.2rem}
.sect{font-family:var(--display); font-size:1.5rem; text-transform:uppercase; letter-spacing:.03em; margin:0; line-height:1}

/* overview */
.ov{display:grid; gap:1rem; grid-template-columns:1fr}
@media (min-width:620px){ .ov{grid-template-columns:1fr 1fr} .ov > :last-child:nth-child(odd){grid-column:1/-1} }
@media (min-width:1120px){ .ov{grid-template-columns:repeat(var(--cols,5),minmax(0,1fr))} .ov > :last-child:nth-child(odd){grid-column:auto} }
.gate{max-width:30rem; margin:3rem auto; display:flex; flex-direction:column; gap:.9rem; align-items:flex-start; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:1.4rem 1.4rem 1.5rem}
.gate h2{font-family:var(--display); font-size:2rem; text-transform:uppercase; margin:0; letter-spacing:.03em; line-height:1}
.gate p{margin:0; color:var(--muted)}
.people{display:flex; flex-direction:column; gap:.4rem; border-top:1px solid var(--line); padding-top:.8rem}
.person{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.1rem .6rem; padding:.45rem .6rem; background:var(--panel-2); border-radius:4px; align-items:center; cursor:pointer; border:1px solid transparent}
.person:hover{border-color:var(--line-2)}
.person .nm{font-weight:600} .person .em{color:var(--muted); font-size:.88em; grid-column:1; overflow-wrap:anywhere}
.person .rl{font-size:.78em; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); white-space:nowrap; grid-row:1/3; align-self:center}
.checks{display:flex; flex-wrap:wrap; gap:.4rem .9rem; grid-column:1/-1}
.f .checks label{display:inline-flex; align-items:center; gap:.4em; font-size:.95rem; text-transform:none; letter-spacing:0; color:var(--fg)}
.f .checks input{width:auto; accent-color:var(--accent)}
.rolehelp{color:var(--faint); font-size:.82em; grid-column:1/-1}
.ovc{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:.85rem .95rem 1rem; display:flex; flex-direction:column; gap:.7rem; min-width:0}
.ovh{display:flex; align-items:center; gap:.55rem; background:none; border:0; padding:0; color:inherit; font:inherit; cursor:pointer; text-align:left; width:100%; border-radius:4px}
.ovh h2{font-family:var(--display); font-size:1.5rem; text-transform:uppercase; margin:0; line-height:1; letter-spacing:.03em; flex:1; min-width:0}
.ovstat{font-size:.8rem; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}
.ovcrew{display:flex; flex-direction:column; gap:.3rem; padding-top:.55rem; border-top:1px solid var(--line)}
.ovcn{display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap}
.ovcn .nm{font-family:var(--display); font-weight:600; font-size:1.15rem; text-transform:uppercase; letter-spacing:.03em}
.ovcn .lead{color:var(--muted); font-size:.85em}
.ovj{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.1rem .5rem; align-items:start; padding:.35rem .5rem; background:var(--panel-2); border-radius:4px}
.ovj .p{font-weight:600; overflow-wrap:anywhere}
.ovj .i{color:var(--muted); font-size:.9em; grid-column:1; overflow-wrap:anywhere}
.ovj.hold{opacity:.7}
.ovnext{display:flex; flex-direction:column; gap:.3rem; padding-top:.55rem; border-top:1px solid var(--line)}
.ovnext h4, .ovyard h4, .lcol h4, .sec h4{font-size:.7rem; text-transform:uppercase; letter-spacing:.13em; color:var(--muted); margin:0}
.ovyard{display:flex; flex-direction:column; gap:.3rem; padding-top:.55rem; border-top:1px solid var(--line)}

/* shop view */
.sh{display:flex; flex-direction:column; gap:1rem}
.shh{display:flex; align-items:center; gap:.7rem 1rem; flex-wrap:wrap}
.shh h2{font-family:var(--display); font-size:2.4rem; text-transform:uppercase; margin:0; line-height:1; letter-spacing:.03em}
.stats{display:flex; gap:.5rem; flex-wrap:wrap}
.stat{display:flex; flex-direction:column; align-items:center; padding:.3rem .8rem; background:var(--panel); border:1px solid var(--line); border-radius:6px; min-width:4.6rem}
.stat b{font-family:var(--display); font-size:1.8rem; line-height:1; font-weight:700; font-variant-numeric:tabular-nums}
.stat span{font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted)}
.stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}
.shh .acts{margin-left:auto}
.crews{display:grid; gap:1rem; grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr))}
.crew{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:.9rem 1rem 1rem; display:flex; flex-direction:column; gap:.55rem; min-width:0}
.crewh{display:flex; align-items:flex-start; gap:.6rem}
.crewh > div{flex:1; min-width:0}
.crew h3{font-family:var(--display); font-size:1.55rem; text-transform:uppercase; margin:0; letter-spacing:.03em; line-height:1.05}
.crew .who{color:var(--muted); font-size:.9rem; overflow-wrap:anywhere}
.crew.un h3{color:var(--muted)}
.sec{display:flex; flex-direction:column; gap:.35rem}
.sec h4{margin-top:.25rem}
.job{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.12rem .6rem; padding:.5rem .65rem; border-radius:4px; background:var(--panel-2); align-items:start; border-left:3px solid transparent}
.job.active{border-left-color:var(--ok)}
.job.queued{border-left-color:var(--line-2)}
.job.hold{border-left-color:var(--warn); opacity:.8}
.job.done{border-left-color:var(--faint); opacity:.75}
.job .p{font-weight:600; overflow-wrap:anywhere}
.job .i{color:var(--muted); font-size:.92em; grid-column:1; overflow-wrap:anywhere}
.job .n{color:var(--faint); font-size:.86em; grid-column:1/-1; overflow-wrap:anywhere}
.job .jacts{grid-column:1/-1; display:flex; gap:.4rem; flex-wrap:wrap; padding-top:.25rem}
.empty{border:1px dashed var(--line-2); border-radius:8px; padding:2rem 1.2rem; text-align:center; color:var(--muted); display:flex; flex-direction:column; gap:.7rem; align-items:center}
.empty h3{font-family:var(--display); font-size:1.9rem; margin:0; color:var(--fg); text-transform:uppercase; letter-spacing:.03em; line-height:1}
.empty p{margin:0; max-width:34em}
.logi{display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.lcol{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:.85rem .95rem 1rem; display:flex; flex-direction:column; gap:.4rem; min-width:0}
.yrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.12rem .6rem; padding:.45rem .6rem; border-radius:4px; background:var(--panel-2); align-items:start}
.yrow .p{font-weight:600; overflow-wrap:anywhere}
.yrow .i{color:var(--muted); font-size:.92em; grid-column:1; overflow-wrap:anywhere}
.yrow .n{color:var(--faint); font-size:.86em; grid-column:1/-1}
.yrow .jacts{grid-column:1/-1; display:flex; gap:.4rem; flex-wrap:wrap; padding-top:.25rem}
.yrow.done{opacity:.7}
details.fin{border-top:1px solid var(--line); padding-top:.6rem}
details.fin summary{cursor:pointer; color:var(--muted); font-weight:600}
details.fin .finlist{display:grid; gap:.5rem; grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr)); padding-top:.6rem}
.msg{padding:1.2rem 1rem; color:var(--muted); text-align:center}

/* sheet */
.sheet-bd{position:fixed; inset:0; background:var(--backdrop); display:flex; align-items:flex-end; justify-content:center; z-index:20; padding:0}
.sheet{background:var(--panel); width:100%; max-width:580px; max-height:90vh; overflow:auto; border-radius:12px 12px 0 0; padding:1rem 1rem calc(1.2rem + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:.9rem; box-shadow:var(--shadow); border:1px solid var(--line)}
@media (min-width:700px){ .sheet-bd{align-items:center; padding:1rem} .sheet{border-radius:10px; padding-bottom:1rem} }
.sheet h3{font-family:var(--display); font-size:1.7rem; margin:0; text-transform:uppercase; letter-spacing:.03em; line-height:1}
.form{display:grid; grid-template-columns:1fr 1fr; gap:.8rem}
.f{display:flex; flex-direction:column; gap:.3rem; grid-column:1/-1; min-width:0}
.f.half{grid-column:auto}
.f label{font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted)}
.f input,.f select,.f textarea{font:inherit; padding:.55em .7em; border:1px solid var(--line-2); border-radius:6px; background:var(--panel-2); color:var(--fg); min-width:0; width:100%}
.f input:focus-visible,.f select:focus-visible,.f textarea:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.f textarea{resize:vertical}
.sheet .acts{justify-content:flex-end}

.toast{position:fixed; left:50%; bottom:calc(1.2rem + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:.6em 1em; border-radius:8px; z-index:30; font-weight:500; max-width:calc(100% - 32px); text-align:center; box-shadow:var(--shadow)}
.foot{padding-top:1.2rem; color:var(--faint); font-size:.82rem; display:flex; gap:1rem; flex-wrap:wrap; justify-content:space-between}
@media (prefers-reduced-motion: no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}} }

/* --- standalone additions --- */
body{margin:0}
img{max-width:100%}
[hidden]{display:none !important}
.btn.ghost{background:transparent}
.signin-note{color:var(--muted); font-size:.9em; margin:0}
.f .hint{color:var(--faint); font-size:.8em}
.setup{max-width:44rem; margin:2rem auto; display:flex; flex-direction:column; gap:.8rem; color:var(--muted)}
.setup h2{font-family:var(--display); font-size:2rem; text-transform:uppercase; color:var(--fg); margin:0; letter-spacing:.03em}
.setup code{background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:.1em .35em; color:var(--fg); font-size:.9em}
.setup ol{margin:0; padding-left:1.3em; display:flex; flex-direction:column; gap:.4rem}
.offline{font-size:.75rem; color:var(--warn); text-transform:uppercase; letter-spacing:.1em}
/* attachments */
.atts{grid-column:1/-1; display:flex; gap:.35rem; flex-wrap:wrap; padding-top:.25rem}
.att{display:inline-flex; align-items:center; gap:.35em; font:inherit; font-size:.82em; font-weight:500; padding:.2em .6em; border-radius:99px; background:var(--panel-2); border:1px solid var(--line-2); color:var(--fg); cursor:pointer; max-width:100%; min-width:0; line-height:1.3}
.att:hover{border-color:var(--muted)}
.att .clip{display:inline-flex; color:var(--muted)} .clip svg{width:1em; height:1em; display:block}
.att span.nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.attc{display:inline-flex; align-items:center; gap:.3em; color:var(--faint); font-size:.82em; grid-column:1}
.viewer{display:flex; flex-direction:column; gap:.6rem; flex:none}
.viewer .pages{display:flex; flex-direction:column; gap:.5rem; background:var(--panel-2); padding:.5rem; border-radius:6px; min-height:6rem}
.viewer canvas,.viewer img{width:100%; height:auto; display:block; background:#fff; border-radius:3px}
.sheet.wide{max-width:980px}
.sheet.wide .acts{position:sticky; bottom:calc(-1.2rem - env(safe-area-inset-bottom,0px)); background:var(--panel); padding-block:.6rem; margin-bottom:calc(-1.2rem - env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line)}
a.btn{text-decoration:none; display:inline-flex; align-items:center}

@media (min-width:760px){ .wkt{min-width:820px} }

  .wk[data-day="4"] td[data-d="4"],.wk[data-day="5"] td[data-d="5"],.wk[data-day="6"] td[data-d="6"]{display:table-cell; border-right:0}

}

<div class="app">

    <div class="clock" id="clock"><div class="d" id="clockD"></div><div class="t" id="clockT"></div></div>

<script type="module">
/* =========================================================================
   SETUP — the only two things to edit.
   1) Paste the firebaseConfig from Firebase console → Project settings → Your apps.
   2) ADMIN_EMAIL is the account that can always manage People.
   ========================================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCgsmliJaB6UBIFw6Y9krUrNcglLKk7DpQ",
  authDomain: "yaboo-shop-board.firebaseapp.com",
  projectId: "yaboo-shop-board",
  storageBucket: "yaboo-shop-board.firebasestorage.app",
  messagingSenderId: "206131007766",
  appId: "1:206131007766:web:6100903417a3ec010f0037"
};
/* The one account that is always an administrator, even before it has a People entry.
   Everyone else gets their access from the People list (Board settings → People). */
const ADMIN_EMAIL = "joejr@yaboofence.com";
/* ========================================================================= */

import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         collection, doc, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, getDoc, increment, arrayUnion, arrayRemove, writeBatch, query, where }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword, updatePassword, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const SHOPS=[
  {id:'pvc',  name:'PVC Shop'},
  {id:'weld', name:'Welding Shop'},
  {id:'wood', name:'Wood Shop'},
  {id:'yard', name:'Yard'},
  {id:'mech', name:'Mechanic Shop'}
];
const SHOP_BY=Object.fromEntries(SHOPS.map(s=>[s.id,s]));
const ROLES={
  admin: {label:'Administrator', desc:'Everything, plus manages People'},
  office:{label:'Office',        desc:'Add, change and finish anything; attach files; board settings'},
  crew:  {label:'Crew',          desc:'Sees their shops and posts progress on jobs'},
  viewer:{label:'View only',     desc:'Sees their shops, changes nothing (use for the TV)'}
};
const STAGES={active:'Working now',queued:'Coming up',hold:'On hold',done:'Finished'};
const EQ_STATUS={ok:'Running',service:'Needs service',down:'Down'};
const YARD={
  in:{label:'Deliveries in',open:'Expected',done:'Received',act:'Mark received'},
  out:{label:'Loads out',open:'To load',done:'Loaded out',act:'Mark loaded'},
  staged:{label:'Staged material',open:'Staged',done:'Pulled',act:'Mark pulled'}
};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const S={
  crews:[],jobs:[],equipment:[],yard:[],files:[],users:[],board:{rotateSec:20,notice:''},
  parts:{}, unsubs:[],
  loaded:false, setupNeeded:false, db:null, auth:null, user:null, me:null, profileMissing:false,
  canWrite:false, role:null, name:'',
  editing:false, tab:'all', tv:false, busy:new Set(), rotateTimer:null, lock:null, offline:false,
  blobCache:new Map(), sheetCleanup:null,
  /* field tab */
  fieldJobs:[], fieldCrews:[], fieldPortions:[], fieldFiles:[], fieldGot:{}, fieldLoaded:false, fieldDenied:false,
  fieldJob:null, fieldView:'board', fieldStage:'all', fieldPm:'all', weekOff:0, weekDay:null
};
const UNITS={pcs:{short:'pcs',long:'pieces',step:'1'},lf:{short:'LF',long:'linear feet',step:'0.5'}};

/* ---------- who am I / what can I see ---------- */
function isOffice(){ return S.role==='admin'||S.role==='office'; }
function isAdmin(){ return S.role==='admin'; }
function visibleShops(){
  if(!S.me) return [];
  if(isOffice()||S.me.all===true) return SHOPS.map(s=>s.id);
  const list=Array.isArray(S.me.shops)?S.me.shops:[];
  return SHOPS.map(s=>s.id).filter(id=>list.includes(id));
}
function canField(){ return isOffice(); }
function tabs(){ const v=visibleShops(); const t=v.length>1?['all',...v]:[...v]; if(canField()) t.push('field'); return t; }
function canSee(shop){ return visibleShops().includes(shop); }
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/';
const CHUNK=700*1024, MAX_FILE=12*1024*1024, MAX_PAGES=30;

const $=id=>document.getElementById(id);
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='text') el.textContent=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(k==='style') el.style.cssText=v;
    else el.setAttribute(k,v===true?'':v);
  }
  for(const kid of kids.flat(Infinity)){
    if(kid==null||kid===false) continue;
    el.append(kid.nodeType?kid:document.createTextNode(String(kid)));
  }
  return el;
}
const ls={
  get(k){ try{ return localStorage.getItem('ysb.'+k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('ysb.'+k,v); }catch(e){} }
};

/* ---------- dates ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDay(s){ if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function daysUntil(s){ const d=parseDay(s); if(!d) return null; return Math.round((d-parseDay(todayStr()))/86400000); }
function fmtDay(s){ const d=parseDay(s); if(!d) return ''; return DOW[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate(); }
function fmtTime(iso){ const d=new Date(iso); if(isNaN(d)) return ''; let hr=d.getHours(); const ap=hr>=12?'PM':'AM'; hr=hr%12||12; return hr+':'+pad(d.getMinutes())+' '+ap; }
function fmtWhen(iso){ const d=new Date(iso); if(isNaN(d)) return ''; const t=fmtTime(iso); const same=d.toDateString()===new Date().toDateString(); return same?t:(DOW[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate()+' '+t); }
function dueChip(j){
  if(j.stage==='done'){ return j.doneAt?h('span',{class:'due ok',text:'Done '+fmtWhen(j.doneAt)}):null; }
  if(!j.due) return null;
  const n=daysUntil(j.due); let cls='due', txt;
  if(n<0){ cls+=' bad'; txt='Overdue '+(-n)+(n===-1?' day':' days'); }
  else if(n===0){ cls+=' warn'; txt='Due today'; }
  else if(n===1){ cls+=' warn'; txt='Due tomorrow'; }
  else if(n<=6){ txt='Due '+DOW[parseDay(j.due).getDay()]; }
  else txt='Due '+fmtDay(j.due);
  return h('span',{class:cls,text:txt});
}
function dateChip(s){
  if(!s) return null; const n=daysUntil(s); let cls='due', txt;
  if(n<0){ cls+=' bad'; txt=fmtDay(s); } else if(n===0){ cls+=' warn'; txt='Today'; } else if(n===1){ cls+=' warn'; txt='Tomorrow'; } else txt=fmtDay(s);
  return h('span',{class:cls,text:txt});
}

/* ---------- selectors ---------- */
function crewsFor(shop){ return S.crews.filter(c=>c.shop===shop).sort((a,b)=>(a.name||'').localeCompare(b.name||'')); }
function jobSort(a,b){ const da=a.due||'9999',db2=b.due||'9999'; if(da!==db2) return da<db2?-1:1; return (a.createdAt||'')<(b.createdAt||'')?-1:1; }
function jobsFor(shop,crewId,stage){ return S.jobs.filter(j=>j.shop===shop&&j.stage===stage&&(crewId===undefined||(j.crewId||'')===crewId)).sort(jobSort); }
function recentDone(shop){ const cut=Date.now()-7*86400000; return S.jobs.filter(j=>j.shop===shop&&j.stage==='done'&&(!j.doneAt||new Date(j.doneAt).getTime()>cut)).sort((a,b)=>(b.doneAt||'')<(a.doneAt||'')?-1:1); }
function eqFor(shop){ const rank={down:0,service:1,ok:2}; return S.equipment.filter(e=>e.shop===shop).sort((a,b)=>(rank[a.status]??3)-(rank[b.status]??3)||(a.name||'').localeCompare(b.name||'')); }
function yardItems(kind,done){ return S.yard.filter(y=>y.kind===kind&&(done?y.status==='done':y.status!=='done')).sort((a,b)=>((a.date||'9999')<(b.date||'9999')?-1:(a.date||'9999')>(b.date||'9999')?1:0)); }
function filesFor(jobId){ return S.files.filter(f=>f.jobId===jobId).sort((a,b)=>(a.createdAt||'')<(b.createdAt||'')?-1:1); }
function clip(){ const s=document.createElement('span'); s.className='clip'; s.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>'; return s; }

/* ---------- render ---------- */
let queued=false;
function scheduleRender(){ if(queued) return; queued=true; requestAnimationFrame(()=>{ queued=false; render(); }); }
function render(){
  renderTabs();
  const main=$('main');
  if(S.setupNeeded){ main.replaceChildren(renderSetup()); renderNotice(); return; }
  if(!S.user){ main.replaceChildren(renderGate('signin')); renderNotice(); renderFoot(); return; }
  if(S.profileMissing){ main.replaceChildren(renderGate('noprofile')); renderNotice(); renderFoot(); return; }
  if(!S.me||!S.loaded){ main.replaceChildren(h('div',{class:'msg',text:'Connecting to the board…'})); renderNotice(); return; }
  const t=tabs();
  if(!t.length){ main.replaceChildren(renderGate('noshops')); renderNotice(); renderFoot(); return; }
  if(!t.includes(S.tab)) S.tab=t[0];

/* progress helpers */
function num(v){ const n=Number(v); return isFinite(n)?n:0; }
function fmtN(n){ n=num(n); return Number.isInteger(n)?String(n):String(Math.round(n*10)/10); }
function hasTarget(j){ return num(j.target)>0; }
function unitOf(j){ return UNITS[j.unit]||FUNITS[j.unit]||UNITS.pcs; }
function pct(j){ return hasTarget(j)?Math.min(100,Math.round(num(j.done)/num(j.target)*100)):0; }
function itemLine(j){
  if(hasTarget(j)) return [j.item,fmtN(j.target)+' '+unitOf(j).short].filter(Boolean).join(' · ');
  return [j.item,j.qty?'× '+j.qty:''].filter(Boolean).join(' ');
}
function progressBar(j,word){
  if(!hasTarget(j)) return null;
  const p=pct(j), full=num(j.done)>=num(j.target);
  return h('div',{class:'pw'},
    h('span',{class:'pl'},h('b',{text:fmtN(j.done)}),' / '+fmtN(j.target)+' '+unitOf(j).short+' '+(word||'done')),
    h('span',{class:'pp'+(full?' full':''),text:p+'%'}),
    h('div',{class:'pb'+(full?' full':''),role:'progressbar','aria-valuenow':String(p),'aria-valuemin':'0','aria-valuemax':'100'},h('i',{style:'width:'+p+'%'})));
}

/* ---------- tabs, clock, theme, TV ---------- */
function setTab(t,quiet){
  /* tapping Field while on a project page is the same as going back to the job board */
  if(t==='field'&&S.tab==='field'&&S.fieldJob&&history.state&&history.state.fj){ history.back(); return; }
  const T=tabs();
  if(!T.includes(t)) t=T[0]||'all';
  S.tab=t; S.fieldJob=null; ls.set('tab',t);
  try{ history.replaceState(null,'','#'+t); }catch(e){}
  if(S.tv&&!quiet) startRotate();
  render();
  if(!quiet) window.scrollTo({top:0});
}
function tickClock(){
  const d=new Date();
  $('clockD').textContent=DOW[d.getDay()]+' '+MON[d.getMonth()]+' '+d.getDate();
  $('clockT').textContent=fmtTime(d.toISOString());
}
const THEMES=['auto','dark','light'];
function applyTheme(t){
  if(!THEMES.includes(t)) t='auto';
  if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t);
  ls.set('theme',t);
  $('btnTheme').textContent='Theme: '+t.charAt(0).toUpperCase()+t.slice(1);
}
function cycleTheme(){ const cur=ls.get('theme')||'auto'; applyTheme(THEMES[(THEMES.indexOf(cur)+1)%THEMES.length]); }
function setEditing(on){
  S.editing=!!on&&S.canWrite;
  document.body.classList.toggle('editing',S.editing);
  ls.set('editing',S.editing?'1':'0');
  updateEditButton();
  render();
}
function updateEditButton(){
  const b=$('btnEdit'), u=$('btnUser');
  b.hidden=!S.canWrite;
  b.classList.toggle('on',S.editing); b.textContent=S.editing?'Editing':'Edit';
  if(!S.user){ u.textContent='Sign in'; u.classList.remove('on'); }
  else { u.textContent=S.name||S.user.email||'Account'; u.classList.toggle('on',S.role==='crew'); }
}
async function doSignOut(){ closeSheet(); try{ await signOut(S.auth); }catch(e){} toast('Signed out.'); }
function openAccount(){
  const r=ROLES[S.role]||{label:S.role||''};
  const shops=isOffice()||(S.me&&S.me.all)?'all shops':visibleShops().map(s=>SHOP_BY[s].name).join(', ')||'no shops';
  openSheet({
    title:'Your account',
    intro:(S.user&&S.user.email||'')+' · '+r.label+' · '+shops,
    values:{pw1:'',pw2:''},
    fields:[
      {key:'pw1',label:'New password',type:'password',autocomplete:'new-password',half:true,hint:'At least 6 characters. Leave blank to keep your password.'},
      {key:'pw2',label:'Repeat it',type:'password',autocomplete:'new-password',half:true}
    ],
    extra:h('div',{class:'acts',style:'border-top:1px solid var(--line);padding-top:.8rem'},
      isAdmin()?h('button',{class:'btn sm',type:'button',text:'People',onclick:()=>{ closeSheet(); openPeople(); }}):null,
      h('span',{class:'spacer'}),
      h('button',{class:'btn sm ghost',type:'button',text:'Sign out',onclick:doSignOut})),
    saveLabel:'Save',
    onSave:async v=>{
      if(!v.pw1&&!v.pw2) return true;
      if(v.pw1.length<6){ toast('Password needs at least 6 characters.'); return false; }
      if(v.pw1!==v.pw2){ toast('The two passwords do not match.'); return false; }
      try{ await updatePassword(S.user,v.pw1); toast('Password changed.'); return true; }
      catch(e){ const c=(e&&e.code)||''; if(c==='auth/requires-recent-login'){ toast('Sign out, sign back in, then change the password.'); } else toast('Could not change the password ('+c+').'); return false; }
    }
  });
}
function rotateMs(){ const s=Number(S.board.rotateSec)||20; return Math.max(8,Math.min(300,s))*1000; }
function startRotate(){ stopRotate(); S.rotateTimer=setInterval(()=>{ if(S.tab==='field') return; const T=tabs().filter(t=>t!=='field'); if(T.length<2) return; const i=T.indexOf(S.tab); setTab(T[(i+1)%T.length],true); },rotateMs()); }
function stopRotate(){ if(S.rotateTimer){ clearInterval(S.rotateTimer); S.rotateTimer=null; } }
async function wakeLock(){ try{ if(navigator.wakeLock&&!S.lock){ S.lock=await navigator.wakeLock.request('screen'); S.lock.addEventListener('release',()=>{ S.lock=null; }); } }catch(e){ S.lock=null; } }
function releaseWake(){ try{ if(S.lock){ S.lock.release(); S.lock=null; } }catch(e){} }
function setTV(on,fromClick){
  S.tv=!!on; document.body.classList.toggle('tv',S.tv); ls.set('tv',S.tv?'1':'0');
  $('btnTV').textContent=S.tv?'Exit TV':'TV mode'; $('btnTV').classList.toggle('on',S.tv);
  if(S.tv){
    if(fromClick){ try{ const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }
    wakeLock(); startRotate();
    if(S.editing) setEditing(false);
  } else {
    try{ if(document.fullscreenElement){ const p=document.exitFullscreen(); if(p&&p.catch) p.catch(()=>{}); } }catch(e){}
    stopRotate(); releaseWake();
  }
  render();
}

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg){
  let t=$('toast'); if(!t){ t=h('div',{class:'toast',id:'toast',role:'status'}); document.body.append(t); }
  t.textContent=msg; t.hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ t.hidden=true; },3400);
}

/* ---------- writes ---------- */
function stamp(d){ d.updatedAt=new Date().toISOString(); d.updatedBy=S.name||(S.user&&S.user.email)||''; return d; }
function writeErr(e){
  const code=(e&&e.code)||'';
  if(code==='permission-denied'||code==='unauthenticated'){ toast('You don’t have permission for that change. If your access was just changed, reload the page.'); }
  else if(code==='resource-exhausted') toast('The board hit its daily free limit. It resets overnight.');
  else if(code==='unavailable') toast('No connection right now. The change will send when the board reconnects.');
  else toast('That change did not save. Try again.');
  console.warn('write failed',e);
}

/* ---------- attachments (PDF scans and photos, stored in Firestore in chunks) ---------- */
function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(r.error); r.readAsDataURL(blob); }); }
function b64ToBytes(b64){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
async function shrinkImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('decode')); i.src=url; });
    const MAXS=2200; const s=Math.min(1,MAXS/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.max(1,Math.round(img.naturalWidth*s)), hh=Math.max(1,Math.round(img.naturalHeight*s));
    const c=document.createElement('canvas'); c.width=w; c.height=hh; c.getContext('2d').drawImage(img,0,0,w,hh);
    const out=await new Promise(res=>c.toBlob(res,'image/jpeg',0.82));
    return out||file;
  } finally{ URL.revokeObjectURL(url); }
}
function pickFile(job,col){
  if(!S.canWrite){ toast('Only office accounts can attach files.'); return; }
  let inp=$('filepick');
  if(!inp){ inp=h('input',{type:'file',id:'filepick',accept:'application/pdf,image/*',style:'position:fixed;left:-9999px;top:0;opacity:0'}); document.body.append(inp); }
  inp.value=''; inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(f) uploadFile(job,f,col); };
  inp.click();
}
async function uploadFile(job,file,col){
  if(!S.db||!job.id) return;
  col=col||'files';
  let blob=file, type=file.type||'', name=(file.name||'file').slice(0,120);
  if(type.startsWith('image/')){ try{ blob=await shrinkImage(file); type='image/jpeg'; name=name.replace(/\.[^.]+$/,'')+'.jpg'; }catch(e){ toast('Could not read that photo.'); return; } }
  else if(type==='application/pdf'||/\.pdf$/i.test(name)){ type='application/pdf'; }
  else { toast('Attach a PDF or a photo.'); return; }
  if(blob.size>MAX_FILE){ toast('That file is over 12 MB. Scan at 150 dpi black-and-white and try again.'); return; }
  const chunks=Math.ceil(blob.size/CHUNK)||1;
  const id=doc(collection(S.db,col)).id;
  try{
    for(let i=0;i<chunks;i++){
      toast('Uploading '+name+' … '+(i+1)+'/'+chunks);
      const b64=await blobToB64(blob.slice(i*CHUNK,(i+1)*CHUNK));
      await setDoc(doc(S.db,col,id,'chunks',String(i)),{d:b64});
    }
    await setDoc(doc(S.db,col,id),stamp({jobId:job.id,shop:job.shop||(col==='fieldFiles'?'field':''),name,type,size:blob.size,chunks,createdAt:new Date().toISOString()}));
    toast('Attached '+name);
  }catch(e){ writeErr(e); }
}
async function deleteFile(meta){
  if(!S.db) return false;
  const col=meta._col||'files';
  try{
    for(let i=0;i<(meta.chunks||0);i++){ await deleteDoc(doc(S.db,col,meta.id,'chunks',String(i))); }
    await deleteDoc(doc(S.db,col,meta.id));
    S.blobCache.delete(meta.id);
    return true;
  }catch(e){ writeErr(e); return false; }
}
async function loadFileBlob(meta){
  if(S.blobCache.has(meta.id)) return S.blobCache.get(meta.id);
  const parts=[];
  for(let i=0;i<(meta.chunks||0);i++){
    const s=await getDoc(doc(S.db,meta._col||'files',meta.id,'chunks',String(i)));
    if(!s.exists()) throw new Error('Part '+(i+1)+' of this file is missing.');
    parts.push(b64ToBytes(s.data().d||''));
  }
  const blob=new Blob(parts,{type:meta.type||'application/octet-stream'});
  S.blobCache.set(meta.id,blob);
  return blob;
}
let pdfjsP=null;
function pdfjs(){
  if(!pdfjsP) pdfjsP=import(PDFJS+'pdf.min.mjs').then(m=>{ m.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.mjs'; return m; });
  return pdfjsP;
}
async function renderPdf(blob,box){
  const lib=await pdfjs();
  const pdf=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
  const n=Math.min(pdf.numPages,MAX_PAGES);
  const cw=Math.max(200,box.clientWidth-16), dpr=Math.min(2,window.devicePixelRatio||1);
  for(let p=1;p<=n;p++){
    const page=await pdf.getPage(p);
    const v0=page.getViewport({scale:1}); const vp=page.getViewport({scale:(cw/v0.width)*dpr});
    const c=document.createElement('canvas'); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
    box.append(c);
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  }
  if(pdf.numPages>n) box.append(h('div',{class:'quiet',text:'Showing the first '+n+' of '+pdf.numPages+' pages. Use "Open in new tab" for the rest.'}));
}

    return 'created';
  }catch(e){
    const c=(e&&e.code)||'';
    if(c==='auth/email-already-in-use') return 'exists';
    if(c==='auth/weak-password') toast('Firebase rejected that password as too weak.');
    else if(c==='auth/invalid-email') toast('That is not a valid email address.');
    else if(c==='auth/operation-not-allowed') toast('Sign-up is turned off in Firebase → Authentication → Settings → User actions.');

}

/* =========================================================================
   FIELD — projects out in the field. Office and administrator logins only for now.
     fieldJobs      one document per project; its `days` map says which crews are on site each day
     fieldPortions  the portions a project is broken into, each with its own quantity and progress
     fieldCrews     the field crews / foremen (kept apart from the shop crews)
     fieldFiles     drawings and paperwork on a project (same chunked storage as the shop attachments)
   ========================================================================= */
const FSTAGES=[
  {id:'awarded',label:'Awarded'},
  {id:'submittals',label:'Submittals'},
  {id:'fab',label:'Fabrication'},
  {id:'ready',label:'Ready to install'},
  {id:'install',label:'Installing'},
  {id:'punch',label:'Punch list'},
  {id:'closed',label:'Closed out'}
];
FSTAGES.forEach((s,i)=>{ s.i=i; });
const FSTAGE_BY=Object.fromEntries(FSTAGES.map(s=>[s.id,s]));
/* The job board lists what is on site first, then what is coming, soonest first. */
const FBOARD_ORDER=['install','punch','ready','fab','submittals','awarded'];
const PSTATUS={none:'Not started',fab:'Fabrication',ready:'Ready to install',install:'Installing',done:'Complete'};
const FUNITS={lf:{short:'LF',long:'linear feet',step:'0.5'},ea:{short:'EA',long:'each',step:'1'}};

/* ---------- field: selectors ---------- */
function fjob(id){ return S.fieldJobs.find(j=>j.id===id)||null; }
function fcrew(id){ return S.fieldCrews.find(c=>c.id===id)||null; }
function fcrewName(c){ return c?(c.name||c.lead||'Crew'):''; }
function fcrewsSorted(){ return [...S.fieldCrews].sort((a,b)=>fcrewName(a).localeCompare(fcrewName(b))); }
function fstage(j){ return FSTAGE_BY[j.stage]||FSTAGE_BY.awarded; }
function byCreated(a,b){ const x=a.createdAt||'', y=b.createdAt||''; return x<y?-1:x>y?1:0; }
function portionsFor(jobId){ return S.fieldPortions.filter(p=>p.jobId===jobId).sort(byCreated); }
function ffilesFor(jobId){ return S.fieldFiles.filter(f=>f.jobId===jobId).sort(byCreated); }
function crewsOn(j,date){ const a=j.days&&j.days[date]; return Array.isArray(a)?a.filter(id=>fcrew(id)):[]; }
function jobsOnDay(crewId,date){ return S.fieldJobs.filter(j=>crewsOn(j,date).includes(crewId)).sort((a,b)=>(a.name||'').localeCompare(b.name||'')); }
function dayNote(c,date){ const n=c&&c.dayNotes&&c.dayNotes[date]; return typeof n==='string'?n:''; }
function fjobSort(a,b){ const ka=a.finish||a.start||'9999', kb=b.finish||b.start||'9999'; if(ka!==kb) return ka<kb?-1:1; return (a.name||'').localeCompare(b.name||''); }
function dstr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(s,n){ const d=parseDay(s); d.setDate(d.getDate()+n); return dstr(d); }
/* Monday-first week containing today, shifted by `off` weeks. */
function weekDates(off){ const t=todayStr(); const mon=addDays(t,-((parseDay(t).getDay()+6)%7)+off*7); return Array.from({length:7},(_,i)=>addDays(mon,i)); }
function fmtDayY(s){ const d=parseDay(s); return d?fmtDay(s)+'/'+String(d.getFullYear()).slice(2):''; }
function isoDay(iso){ const d=new Date(iso); return isNaN(d)?'':(d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2); }
/* The day itself, or the day plus the rest of that work week. */
function repeatDates(date,rep){
  const out=[date]; if(rep!=='fri'&&rep!=='sat') return out;
  const last=rep==='sat'?6:5, d=parseDay(date);
  if(d.getDay()===0) return out;
  for(let i=0;i<7;i++){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w===0||w>last) break; out.push(dstr(d)); }
  return out;
}
const REPEAT_OPTS=[{value:'one',label:'This day only'},{value:'fri',label:'This day through Friday'},{value:'sat',label:'This day through Saturday'}];
function fDateChip(j){
  if(j.stage==='closed') return h('span',{class:'due ok',text:j.closedAt?'Closed '+isoDay(j.closedAt):'Closed'});
  if(fstage(j).i<FSTAGE_BY.install.i&&j.start){
    const n=daysUntil(j.start);
    if(n<0) return h('span',{class:'due bad',text:'Start was '+fmtDay(j.start)});
    if(n===0) return h('span',{class:'due warn',text:'Starts today'});
    if(n===1) return h('span',{class:'due warn',text:'Starts tomorrow'});
    return h('span',{class:'due',text:'Starts '+fmtDay(j.start)});
  }
  return j.finish?dueChip({due:j.finish,stage:''}):null;
}
function checklist(items,checked){
  const box=h('div',{class:'checks col'}), cbs={};
  items.forEach((it,i)=>{
    const c=h('input',{type:'checkbox',id:'ck_'+i}); c.checked=checked.includes(it.value); cbs[it.value]=c;
    box.append(h('label',{for:'ck_'+i},c,h('span',{},it.label,it.sub?h('span',{class:'st',text:' · '+it.sub}):null)));
  });
  box.read=()=>Object.keys(cbs).filter(k=>cbs[k].checked);
  box.set=vals=>{ for(const k of Object.keys(cbs)) cbs[k].checked=vals.includes(k); };
  return box;
}

function miniPortion(p){
  const t=hasTarget(p);
  return h('div',{class:'fpor'},h('span',{class:'pn',text:p.name||'(portion)'}),
    t?h('div',{class:'pb'+(num(p.done)>=num(p.target)?' full':'')},h('i',{style:'width:'+pct(p)+'%'})):null,
    h('span',{class:'pq',text:t?fmtN(p.done)+' / '+fmtN(p.target)+' '+unitOf(p).short:(PSTATUS[p.status]||PSTATUS.none)}));
}
function fieldCard(j){
  const st=fstage(j);
  const card=h('article',{class:'fcard st-'+st.id,role:'button',tabindex:'0','aria-label':'Open '+(j.name||'project')});
  card.addEventListener('click',()=>openFieldPage(j.id));
  card.addEventListener('keydown',ev=>{ if(ev.target===card&&(ev.key==='Enter'||ev.key===' ')){ ev.preventDefault(); openFieldPage(j.id); } });
  const sub=[j.customer,j.location].filter(Boolean).join(' · ');
  card.append(h('div',{class:'ftop'},h('span',{class:'nm',text:j.name||'(no name)'}),fDateChip(j)||h('span'),sub?h('span',{class:'sub',text:sub}):null));
  const lead=fcrew(j.crewId);
  const meta=[j.jobNo?'#'+j.jobNo:'',j.pm?'PM '+j.pm:'',lead?fcrewName(lead):''].filter(Boolean).join(' · ');
  if(meta) card.append(h('div',{class:'meta',text:meta}));
  if(st.id!=='closed'){
    const on=crewsOn(j,todayStr()).map(id=>fcrewName(fcrew(id)));

    if(j.next) card.append(h('div',{class:'fnext',text:j.next}));
  }
  const pors=portionsFor(j.id);
  pors.slice(0,3).forEach(p=>card.append(miniPortion(p)));

}

  row('Start on site',j.start?fmtDayY(j.start):'');
  row('Finish by',j.finish?fmtDayY(j.finish):'');
  wrap.append(info);

  const pors=portionsFor(j.id);
  const psec=h('div',{class:'fsec'},h('div',{class:'fsech'},h('h3',{text:'Portions of the project'}),
    h('button',{class:'btn sm pri ed',type:'button',text:'+ Portion',onclick:()=>openPortion({},j)})));
  if(pors.length){ const list=h('div',{class:'plist'}); pors.forEach(p=>list.append(portionRow(p,j))); psec.append(list); }
  else psec.append(h('div',{class:'quiet',text:'Nothing broken out yet. Add each portion of the job and track it on its own.'}));
  wrap.append(psec);

  const days=Object.keys(j.days||{}).filter(d=>crewsOn(j,d).length).sort();
  const past=days.filter(d=>d<today), up=days.filter(d=>d>=today);
  const csec=h('div',{class:'fsec'},h('div',{class:'fsech'},h('h3',{text:'Crew on site'}),
    h('button',{class:'btn sm ed',type:'button',text:'+ Schedule crew',onclick:()=>openJobDay(j,null)})));
  if(up.length){

    up.slice(0,12).forEach(d=>dl.append(h('div',{class:'drow'+(d===today?' today':'')},

      h('button',{class:'btn sm ed',type:'button',text:'Change',onclick:()=>openJobDay(j,d)}))));
    csec.append(dl);
    if(up.length>12) csec.append(h('div',{class:'quiet',text:'+'+(up.length-12)+' more days scheduled'}));
  } else csec.append(h('div',{class:'quiet',text:S.fieldCrews.length?'No crew scheduled from today on.':'No field crews set up yet. Add them on the Field tab (+ Field crew), then schedule them here or on the Crew schedule.'}));
  if(past.length){ const cd=past.reduce((n,d)=>n+crewsOn(j,d).length,0); csec.append(h('div',{class:'quiet',text:cd+' crew-day'+(cd===1?'':'s')+' on site before today · first day '+fmtDayY(past[0])})); }

function portionRow(p,j){
  const cls=p.status==='install'?'active':p.status==='done'?'done':'queued';

  if(hasTarget(p)&&p.status!=='done') acts.append(h('button',{class:'btn sm cr',type:'button',text:'+ Progress',onclick:()=>postPortion(p,j)}));

/* Crews × days for one week. Tap a job to open its page; in Edit, each cell can be assigned. */
function renderWeek(){
  const dates=weekDates(S.weekOff), today=todayStr(), crews=fcrewsSorted();
  const box=h('div',{class:'fsec'});
  const first=parseDay(dates[0]);
  const go=n=>{ S.weekOff=n; S.weekDay=null; render(); };
  box.append(h('div',{class:'wkhead'},h('span',{class:'lbl',text:'Week of '+MON[first.getMonth()]+' '+first.getDate()}),
    h('button',{class:'btn sm',type:'button',text:'‹','aria-label':'Previous week',onclick:()=>go(S.weekOff-1)}),
    S.weekOff!==0?h('button',{class:'btn sm',type:'button',text:'This week',onclick:()=>go(0)}):null,
    h('button',{class:'btn sm',type:'button',text:'›','aria-label':'Next week',onclick:()=>go(S.weekOff+1)})));
  if(!crews.length){
    box.append(h('div',{class:'empty'},h('h3',{text:'No field crews yet'}),
      h('p',{text:'Turn on Edit and add each field crew or foreman. Then put them on jobs day by day here.'}),
      h('div',{class:'acts ed'},h('button',{class:'btn pri',type:'button',text:'+ Field crew',onclick:()=>openFieldCrew({})}))));
    return box;
  }
  /* Sunday only takes up a column when something is on it, or while assigning. */
  const sunUsed=crews.some(c=>jobsOnDay(c.id,dates[6]).length||dayNote(c,dates[6]));
  const show=dates.map((d,i)=>i<6||sunUsed||S.editing);
  let sel=S.weekDay;
  if(sel==null||!show[sel]){ const ti=dates.indexOf(today); sel=ti>=0&&show[ti]?ti:0; }
  const wk=h('div',{class:'wk','data-day':String(sel)});
  const chips=h('div',{class:'wkdays'});
  const hr=h('tr',{},h('th',{class:'crewc',text:'Crew'}));
  dates.forEach((d,i)=>{
    if(!show[i]) return; const dd=parseDay(d);
    chips.append(h('button',{class:'wkday'+(d===today?' today':''),type:'button','aria-pressed':i===sel?'true':'false',text:DOW[dd.getDay()]+' '+dd.getDate(),onclick:()=>{ S.weekDay=i; render(); }}));
    hr.append(h('th',{class:d===today?'today':'',text:DOW[dd.getDay()]+' '+(dd.getMonth()+1)+'/'+dd.getDate()}));
  });
  wk.append(chips);
  const tb=h('tbody');
  for(const c of crews){
    const tr=h('tr',{},h('th',{class:'crewc',scope:'row'},h('span',{class:'nm',text:fcrewName(c)}),
      (c.lead&&c.lead!==c.name)?h('span',{class:'lead',text:c.lead}):null,
      h('button',{class:'btn sm ed',type:'button',text:'Edit crew',style:'margin-top:.4rem',onclick:()=>openFieldCrew(c)})));
    dates.forEach((d,i)=>{
      if(!show[i]) return;
      const jobs=jobsOnDay(c.id,d), note=dayNote(c,d);
      const cell=h('div',{class:'wkc'});
      jobs.forEach(j=>cell.append(h('button',{class:'wkj st-'+fstage(j).id,type:'button',text:j.name||'(no name)',onclick:()=>openFieldPage(j.id)})));
      if(note) cell.append(h('span',{class:'wknote',text:note}));
      if(!jobs.length&&!note) cell.append(h('span',{class:'quiet',text:'—'}));
      cell.append(h('button',{class:'btn sm ed',type:'button',text:(jobs.length||note)?'Change':'+ Assign',onclick:()=>openCrewDay(c,d)}));
      tr.append(h('td',{class:d===today?'today':'','data-d':String(i)},cell));
    });
    tb.append(tr);
  }
  wk.append(h('div',{class:'wkwrap'},h('table',{class:'wkt'},h('thead',{},hr),tb)));
  box.append(wk);
  const shown=dates.filter((d,i)=>show[i]);
  const gaps=S.fieldJobs.filter(j=>j.stage==='install'&&!shown.some(d=>crewsOn(j,d).length));
  if(gaps.length) box.append(h('div',{class:'quiet',text:'Installing, with no crew on this week’s schedule: '+gaps.map(j=>j.name||'(no name)').join(', ')}));
  return box;
}

async function setFieldStage(j,stage){
  if(!j.id||S.busy.has(j.id)||j.stage===stage) return; S.busy.add(j.id);
  await mergeDocAt('fieldJobs',j.id,stamp({stage:stage,closedAt:stage==='closed'?new Date().toISOString():''}));
  S.busy.delete(j.id);
}
async function deleteFieldJob(j,quiet){
  if(!quiet&&S.tab==='field'&&S.fieldJob===j.id) closeFieldPage();

  for(const p of portionsFor(j.id)){ if(!(await delDocAt('fieldPortions',p.id))) return false; }
  return delDocAt('fieldJobs',j.id);
}

      {key:'unit',label:'Measured in',type:'select',half:true,options:Object.entries(FUNITS).map(([v,u])=>({value:v,label:u.long+' ('+u.short+')'}))},

      /* work from the portion as it is now, so progress posted while this sheet was open is kept;
         the total only changes if the Installed so far box was actually edited */
      const cur=isNew?p:(S.fieldPortions.find(x=>x.id===p.id)||p);
      const fixed=!isNew&&v.done!==(hasTarget(p)?fmtN(p.done):'');
      const done=isNew?0:(fixed?Math.max(0,Number(v.done)||0):num(cur.done));
      const data=stamp({jobId:j.id,name:v.name,target:target,unit:FUNITS[v.unit]?v.unit:'lf',done:target?done:0,log:Array.isArray(cur.log)?cur.log:[],status:PSTATUS[v.status]?v.status:'none',note:v.note,createdAt:p.createdAt||now});
      if(fixed&&target) data.log=[...data.log,{n:done,set:true,by:S.name||'',at:now,note:'corrected in Edit portion'}];
      if(j.example) data.example=true;
      return isNew?addDocTo('fieldPortions',data):setDocAt('fieldPortions',p.id,data);

/* One crew, one day (from the week grid): which jobs it is on. Whatever is ticked becomes that crew's day. */
function openCrewDay(c,date){
  const cur=jobsOnDay(c.id,date).map(j=>j.id);
  const rank={install:0,punch:1,ready:2,fab:3,submittals:4,awarded:5};
  const r=j=>{ const x=rank[fstage(j).id]; return x==null?9:x; };
  const jobs=S.fieldJobs.filter(j=>fstage(j).id!=='closed'||cur.includes(j.id)).sort((a,b)=>r(a)-r(b)||(a.name||'').localeCompare(b.name||''));
  const list=checklist(jobs.map(j=>({value:j.id,label:j.name||'(no name)',sub:fstage(j).label})),cur);
  openSheet({
    title:fcrewName(c)+' · '+fmtDay(date),
    before:h('div',{class:'f'},h('label',{text:'On which job'}),jobs.length?list:h('div',{class:'quiet',text:'No open projects yet. Add a project first.'})),
    values:{note:dayNote(c,date),rep:'one'},
    fields:[
      {key:'note',label:'Note for the day (optional)',placeholder:'e.g. shop day, off, rain date, half day'},
      {key:'rep',label:'Apply to',type:'select',options:REPEAT_OPTS}
    ],
    onSave:async v=>{
      if(!S.db) return false;
      if(!fcrew(c.id)){ toast('That crew was deleted while you had it open.'); return false; }
      const pick=list.read(), dates=repeatDates(date,v.rep);
      /* every job and the note go in one batch, so a dropped connection can't leave half a schedule */
      const batch=writeBatch(S.db); let n=0;
      for(const j of S.fieldJobs){
        const days={}; let touched=false;
        for(const d of dates){
          const on=pick.includes(j.id), was=crewsOn(j,d).includes(c.id);
          if(on&&!was){ days[d]=arrayUnion(c.id); touched=true; }
          else if(!on&&was){ days[d]=arrayRemove(c.id); touched=true; }
        }
        if(touched){ batch.set(doc(S.db,'fieldJobs',j.id),stamp({days}),{merge:true}); n++; }
      }
      const notes={}; let changed=false;
      for(const d of dates){ if(dayNote(c,d)!==v.note){ notes[d]=v.note; changed=true; } }
      if(changed){ batch.set(doc(S.db,'fieldCrews',c.id),stamp({dayNotes:notes}),{merge:true}); n++; }
      if(!n) return true;
      try{ await batch.commit(); return true; }catch(e){ writeErr(e); return false; }
    }
  });
}
/* One job, one day (from the job's page): which crews are on it. */
function openJobDay(j,date){
  const crews=fcrewsSorted();
  if(!crews.length){ toast('Add a field crew first: Field tab, + Field crew.'); return; }
  const start=date||todayStr();
  const list=checklist(crews.map(c=>({value:c.id,label:fcrewName(c),sub:c.lead&&c.lead!==c.name?c.lead:''})),crewsOn(j,start));
  openSheet({
    title:'Crew on site',
    intro:j.name||'',
    values:{date:start,rep:'one'},
    fields:[
      {key:'date',label:'Day',type:'date',half:true},
      {key:'rep',label:'Apply to',type:'select',half:true,options:REPEAT_OPTS}
    ],
    extra:h('div',{class:'f'},h('label',{text:'Crews on this job that day'}),list),
    onSave:async v=>{
      if(!parseDay(v.date)){ toast('Pick a day.'); return false; }
      const pick=list.read(), days={};
      for(const d of repeatDates(v.date,v.rep)) days[d]=pick;
      return mergeDocAt('fieldJobs',j.id,stamp({days}));
    }
  });
  const di=$('f_date');
  if(di) di.addEventListener('change',()=>{ if(parseDay(di.value)) list.set(crewsOn(j,di.value)); });
}

      const ref=await addDoc(collection(S.db,'fieldJobs'),mk({name:j.name,customer:j.customer,location:j.location,jobNo:j.jobNo,pm:S.name||'',crewId:j.crewId,stage:j.stage,start:j.start,finish:j.finish,next:j.next,note:'',days:j.days,closedAt:''}));
      let n=0;
      for(const p of j.portions){
        const at=new Date(Date.now()+(n++)).toISOString();
        await addDoc(collection(S.db,'fieldPortions'),mk({jobId:ref.id,name:p.name,target:p.target,unit:p.unit,done:p.done,log:p.done?[{n:p.done,set:true,by:'EXAMPLE',at:now,note:''}]:[],status:p.status,note:'',createdAt:at}));
      }
    }
    toast('Example projects loaded. Everything it added is marked EXAMPLE.');
  }catch(e){ writeErr(e); }
}

/* ---------- examples (opt-in, all flagged example:true) ---------- */
function dayPlus(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

      {shop:'weld',crew:'weld/Weld 1',project:'EXAMPLE — Cantilever slide gate',item:'26 ft gate frame',target:1,unit:'pcs',done:0,due:dayPlus(9),stage:'queued'},
      {shop:'weld',crew:'weld/Weld 2',project:'EXAMPLE — Park entrance',item:'Double swing gate 14 ft',target:2,unit:'pcs',done:2,due:dayPlus(-1),stage:'active',note:'Waiting on hinges'},
      {shop:'weld',crew:'',project:'EXAMPLE — Loading dock bollards',item:'Bollard sleeves',target:20,unit:'pcs',done:0,due:dayPlus(14),stage:'queued'},
      {shop:'wood',crew:'wood/Wood crew',project:'EXAMPLE — School playground',item:'Stockade sections 6 ft',target:320,unit:'lf',done:96,due:dayPlus(4),stage:'active'},
      {shop:'yard',crew:'yard/Yard crew',project:'EXAMPLE — Truck loading',item:'Load Truck 3 for Bronx job',target:0,unit:'pcs',done:0,due:dayPlus(0),stage:'active'},
      {shop:'mech',crew:'mech/Mechanics',project:'EXAMPLE — Truck 2',item:'Brakes + inspection',target:0,unit:'pcs',done:0,due:dayPlus(2),stage:'active'},
      {shop:'mech',crew:'mech/Mechanics',project:'EXAMPLE — Auger',item:'Hydraulic hose replacement',target:0,unit:'pcs',done:0,due:dayPlus(5),stage:'hold',note:'Part on order'}
    ];
    for(const j of jobs){ const log=j.done?[{n:j.done,set:true,by:'EXAMPLE',at:now,note:''}]:[]; await addDoc(collection(S.db,'jobs'),mk({shop:j.shop,crewId:ids[j.crew]||'',project:j.project,item:j.item,qty:'',target:j.target,unit:j.unit,done:j.done,log:log,due:j.due,stage:j.stage,note:j.note||'',doneAt:''})); }
    const eq=[
      {shop:'weld',name:'Plasma table',status:'ok',note:''},
      {shop:'weld',name:'Ironworker',status:'service',note:'EXAMPLE — punch die worn'},
      {shop:'yard',name:'Forklift 2',status:'down',note:'EXAMPLE — hydraulic leak'},
      {shop:'wood',name:'Table saw',status:'ok',note:''}
    ];
    for(const e of eq){ await addDoc(collection(S.db,'equipment'),mk(e)); }
    const yard=[
      {kind:'in',project:'EXAMPLE — Rec center perimeter',desc:'Chain link fabric 9 ga',qty:'6 rolls',date:dayPlus(0),carrier:'Supplier truck',status:'open',note:''},
      {kind:'out',project:'EXAMPLE — Bronx job',desc:'Posts, rails, fittings',qty:'',date:dayPlus(1),carrier:'Truck 3',status:'open',note:'Stage by gate A'},
      {kind:'staged',project:'EXAMPLE — Station platform railing',desc:'Galv panels back from galvanizer',qty:'12',date:dayPlus(-2),carrier:'',status:'open',note:'Rack 4'}
    ];

async function removeExamples(){
  const items=[['crews',S.crews],['jobs',S.jobs],['equipment',S.equipment],['yard',S.yard],['fieldCrews',S.fieldCrews]].flatMap(([col,arr])=>arr.filter(d=>d.example).map(d=>[col,d.id]));
  const fjobs=S.fieldJobs.filter(d=>d.example);
  if(!items.length&&!fjobs.length){ toast('No example data on the board.'); return; }
  toast('Removing '+(items.length+fjobs.length)+' example items…');
  for(const j of fjobs){ if(!(await deleteFieldJob(j,true))) return; }
  for(const [col,id] of items){
    if(col==='jobs'){ for(const f of filesFor(id)){ if(!(await deleteFile(f))) return; } }
    if(!(await delDocAt(col,id))) return;
  }
  toast('Example data removed.');
}

/* ---------- store ---------- */
function listen(ref,onData,label){
  const un=onSnapshot(ref,{includeMetadataChanges:true},snap=>{ onData(snap); setOffline(snap.metadata.fromCache&&!navigator.onLine); scheduleRender(); },
    err=>{ console.warn('subscribe failed',label,err); if(err&&err.code==='permission-denied') toast('The board refused to load '+label+'. If your access was just changed, reload; otherwise the Firestore rules need republishing.'); });
  S.unsubs.push(un);
}
function docsOf(snap){ return snap.docs.map(d=>Object.assign({id:d.id},d.data())); }
/* One collection, either whole (office / all-shops accounts) or one query per shop the person may see —
   the rules only allow queries that are already limited to a shop the account can read. */
function subscribeScoped(col,shopField){
  S.parts[col]={};
  const merge=()=>{ S[col]=Object.values(S.parts[col]).flat(); S.loaded=true; };
  if(isOffice()||(S.me&&S.me.all===true)){
    listen(collection(S.db,col),snap=>{ S.parts[col].all=docsOf(snap); merge(); },col);
    return;
  }
  const shops=visibleShops();
  if(!shops.length){ S[col]=[]; S.loaded=true; return; }
  for(const sh of shops){
    listen(query(collection(S.db,col),where(shopField,'==',sh)),snap=>{ S.parts[col][sh]=docsOf(snap); merge(); },col+'/'+sh);
  }
}
function startData(){
  stopData();
  subscribeScoped('crews','shop');
  subscribeScoped('jobs','shop');
  subscribeScoped('equipment','shop');
  subscribeScoped('files','shop');
  if(canSee('yard')) listen(collection(S.db,'yard'),snap=>{ S.yard=docsOf(snap); S.loaded=true; },'yard'); else S.yard=[];
  listen(doc(S.db,'config','board'),snap=>{ if(snap.exists()){ Object.assign(S.board,snap.data()); if(S.tv) startRotate(); } S.loaded=true; },'settings');
  if(isAdmin()) listen(collection(S.db,'users'),snap=>{ S.users=docsOf(snap); },'people');
  if(canField()) startField();
}
/* Field data is office-only. If the rules in Firebase are older than this page, these come back
   permission-denied; the Field tab then shows the one setup step instead of nagging every screen with a toast. */
function listenField(col,onData){
  const un=onSnapshot(collection(S.db,col),{includeMetadataChanges:true},snap=>{ onData(docsOf(snap)); S.fieldGot[col]=true; S.fieldLoaded=['fieldJobs','fieldCrews','fieldPortions'].every(c=>S.fieldGot[c]); scheduleRender(); },
    err=>{ console.warn('field subscribe failed',col,err); if(err&&err.code==='permission-denied'){ S.fieldDenied=true; scheduleRender(); } });
  S.unsubs.push(un);
}
function startField(){
  listenField('fieldJobs',d=>{ S.fieldJobs=d; });
  listenField('fieldCrews',d=>{ S.fieldCrews=d; });
  listenField('fieldPortions',d=>{ S.fieldPortions=d; });
  listenField('fieldFiles',d=>{ S.fieldFiles=d.map(x=>Object.assign(x,{_col:'fieldFiles'})); });
}
function stopData(){
  for(const un of S.unsubs){ try{ un(); }catch(e){} }
  S.unsubs=[]; S.parts={};
  S.crews=[]; S.jobs=[]; S.equipment=[]; S.yard=[]; S.files=[]; S.users=[]; S.board={rotateSec:20,notice:''};
  S.fieldJobs=[]; S.fieldCrews=[]; S.fieldPortions=[]; S.fieldFiles=[]; S.fieldGot={}; S.fieldLoaded=false; S.fieldDenied=false;
  S.loaded=false;
}
function setOffline(on){ if(S.offline===on) return; S.offline=on; $('offline').hidden=!on; }
function applyProfile(prof){
  S.me=prof; S.profileMissing=!prof;
  S.role=prof?prof.role:null;
  S.name=prof?(prof.name||''):'';
  S.canWrite=isOffice();
  document.body.classList.toggle('crew',S.role==='crew');
  if(!S.canWrite&&S.editing) setEditing(false);
  if(S.canWrite&&ls.get('editing')==='1'&&!S.tv&&!S.editing) setEditing(true);
  updateEditButton();
  if(prof){ startData(); const T=tabs(); if(!T.includes(S.tab)) S.tab=T[0]||'all'; }
  render();
}
let profileUnsub=null;
function connect(){
  if(!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey==='PASTE_ME'){ S.setupNeeded=true; render(); return; }
  const app=initializeApp(FIREBASE_CONFIG);
  let db;
  try{ db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})}); }
  catch(e){ db=getFirestore(app); }
  S.db=db; S.auth=getAuth(app);
  onAuthStateChanged(S.auth,u=>{
    S.user=u||null;
    if(profileUnsub){ try{ profileUnsub(); }catch(e){} profileUnsub=null; }
    stopData(); S.me=null; S.profileMissing=false; S.role=null; S.canWrite=false;
    document.body.classList.remove('crew'); if(S.editing) setEditing(false);
    updateEditButton(); render();
    if(!u) return;
    const email=(u.email||'').toLowerCase();
    // Follow our own People entry live, so a role change takes effect without signing out.
    profileUnsub=onSnapshot(doc(S.db,'users',email),snap=>{
      let prof=snap.exists()?Object.assign({id:snap.id,email},snap.data()):null;
      if(!prof&&email===ADMIN_EMAIL.toLowerCase()){
        prof={id:email,email,name:ls.get('name')||'Admin',role:'admin',all:true,shops:[]};
        setDoc(doc(S.db,'users',email),stamp({name:prof.name,role:'admin',all:true,shops:[],createdAt:new Date().toISOString()})).catch(()=>{});
      }
      const same=S.me&&prof&&S.me.role===prof.role&&S.me.all===prof.all&&JSON.stringify(S.me.shops||[])===JSON.stringify(prof.shops||[]);
      if(same){ S.me=prof; S.name=prof.name||''; updateEditButton(); scheduleRender(); return; }
      applyProfile(prof);
    },err=>{ console.warn('profile',err); applyProfile(null); });
  });
}

/* ---------- boot ---------- */
/* The address is #<tab>, or #field/<project id> for a project's own page (so the phone's Back button returns to the job board). */
function parseHash(){
  const hs=(location.hash||'').slice(1); const m=hs.match(/^field\/(.+)$/);
  let job=null; if(m){ try{ job=decodeURIComponent(m[1]); }catch(e){ job=m[1]; } }
  return m?{tab:'field',job}:{tab:hs,job:null};
}
function route(){
  const r=parseHash();
  if(!r.tab){ if(S.tab==='field'&&S.fieldJob){ S.fieldJob=null; render(); } return; }
  if(!tabs().includes(r.tab)) return;
  if(r.tab===S.tab&&r.job===S.fieldJob) return;
  const backToBoard=S.tab==='field'&&S.fieldJob&&r.tab==='field'&&!r.job;
  S.tab=r.tab; S.fieldJob=r.job; ls.set('tab',r.tab);
  if(S.tv) startRotate();
  render();
  window.scrollTo({top:backToBoard?(S.fieldScroll||0):0});
}
function boot(){
  const r=parseHash();
  S.tab=r.tab||ls.get('tab')||'all'; S.fieldJob=r.tab==='field'?r.job:null;
  S.fieldView=ls.get('fview')==='week'?'week':'board'; S.fieldPm=ls.get('fpm')||'all';
  S.name=ls.get('name')||'';
  applyTheme(ls.get('theme')||'auto');
  tickClock(); setInterval(tickClock,15000);
  $('btnEdit').addEventListener('click',()=>{ if(S.editing) setEditing(false); else if(S.canWrite) setEditing(true); });
  $('btnUser').addEventListener('click',()=>{ if(S.user) openAccount(); else openSignIn(); });
  $('btnTV').addEventListener('click',()=>setTV(!S.tv,true));
  $('btnTheme').addEventListener('click',cycleTheme);
  $('btnBoard').addEventListener('click',openBoard);
  $('btnNotice').addEventListener('click',openBoard);
  $('sheetbd').addEventListener('click',ev=>{ if(ev.target===$('sheetbd')) closeSheet(); });
  document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&!$('sheetbd').hidden) closeSheet(); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&S.tv) wakeLock(); });
  window.addEventListener('hashchange',route);
  window.addEventListener('online',()=>setOffline(false));
  if(ls.get('tv')==='1') setTV(true,false);
  render();
  connect();
}
boot();
